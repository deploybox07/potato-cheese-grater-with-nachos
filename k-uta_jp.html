<!DOCTYPE html>
<html lang="ja" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Twih 🥀</title>
    <style>
        .twitch-embeds {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 1rem;
        }

        .twitch-video iframe {
            display: block;
            width: min(800px, 100%);
            height: 500px;
            border: 0;
        }

        .twitch-chat iframe {
            display: block;
            width: 350px;
            height: 500px;
            border: 0;
        }
    </style>
</head>
<body translate="no" class="notranslate">

    <main class="twitch-embeds">
        <!-- Replace YOUR_CHANNEL with the Twitch channel name. -->
        <div class="twitch-video">
            <iframe
                src="https://player.twitch.tv/?channel=YOUR_CHANNEL&amp;parent=localhost"
                title="Twitch video player"
                width="800"
                height="500"
                allowfullscreen>
            </iframe>
        </div>

        <div class="twitch-chat">
            <iframe
                src="https://www.twitch.tv/embed/YOUR_CHANNEL/chat?parent=localhost"
                title="Twitch chat"
                width="350"
                height="500">
            </iframe>
        </div>
    </main>

</body>
</html>
