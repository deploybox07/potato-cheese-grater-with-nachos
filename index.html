<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Hosted YT Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        .input-area {
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 70%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #333;
            border-radius: 4px;
            background-color: #222;
            color: #fff;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #cc0000;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            background-color: #000;
            border-radius: 8px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Custom YouTube Player</h2>
    
    <div class="input-area">
        <input type="text" id="videoUrl" placeholder="Paste YouTube URL or Video ID here...">
        <button onclick="loadVideo()">Load Video</button>
    </div>

    <div class="video-container">
        <!-- The iframe starts with a placeholder or empty, and updates via JavaScript -->
        <iframe id="ytPlayer" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
</div>

<script>
    function extractVideoId(url) {
        // Regular expression to extract the YouTube Video ID from various URL formats
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        
        if (match && match[2].length === 11) {
            return match[2];
        } else {
            // If it's already just the 11-character ID
            return url.trim().length === 11 ? url.trim() : null;
        }
    }

    function loadVideo() {
        const input = document.getElementById('videoUrl').value;
        const videoId = extractVideoId(input);
        const player = document.getElementById('ytPlayer');

        if (videoId) {
            // Update the iframe source to the embedded version of the video
            player.src = `https://youtube.com{videoId}?autoplay=1`;
        } else {
            alert('Please enter a valid YouTube URL or 11-digit Video ID.');
        }
    }
</script>

</body>
</html>
